[package]
name = "app"
version = "0.1.0"
description = "Claude Code 会话可视化面板（本地只读 + 归档）"
authors = ["yichen"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
dirs = "6"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-clipboard-manager = "2"

[profile.release]
strip = true
lto = true
